name: liana_dashboard

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # Data manipulation
  - pandas>=2.0
  - numpy>=1.24

  # Interactive plotting
  - plotly>=5.15
  - networkx>=3.0

  # Scientific compatibility
  - scanpy>=1.9
  - anndata>=0.9

  # Utilities
  - typing-extensions>=4.0

  - pip:
      - shiny>=0.6.0
      - shinywidgets>=0.2.0
      - htmltools>=0.5.0
      - uvicorn